services:
  db:
    image: postgres:16-alpine
    container_name: empdb
    environment:
      POSTGRES_USER: empuser
      POSTGRES_PASSWORD: emppassword
      POSTGRES_DB: employee_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empuser -d employee_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:16-alpine
    container_name: empdb_test
    environment:
      POSTGRES_USER: empuser
      POSTGRES_PASSWORD: emppassword
      POSTGRES_DB: employee_management_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empuser -d employee_management_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
